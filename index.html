<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мои 10 ценностей</title>
<meta name="description" content="Личная сессия: найди и подтверди 10 своих ценностей.">
<meta name="theme-color" content="#FBF8F1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ценности">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Тема: намеренно только светлая — слоновая кость, белые карточки, золото */
:root {
  color-scheme: light;
  --bg: #FBF8F1;
  --surface: #FFFFFF;
  --ink: #2B2418;
  --muted: #7B6F5B;
  --line: #EADFC8;
  --accent: #8F6D2C;
  --accent-soft: #F7EFDD;
  --gold-1: #E2C47F;
  --gold-2: #BF9A4E;
  --gold-3: #8F6D2C;
  --gold-line: #DCC594;
  --bronze: #9A6A45;
  --bronze-soft: #F8EEE3;
  --danger: #9E3B2C;
  --shadow: 0 24px 48px -30px rgba(122, 90, 30, .45), 0 2px 6px -2px rgba(122, 90, 30, .12);
  --gold-grad: linear-gradient(135deg, var(--gold-1) 0%, var(--gold-2) 48%, var(--gold-3) 100%);
  --f-display: "Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
  --f-body: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 20px;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; color: var(--ink); font-family: var(--f-body); font-size: 15.5px; line-height: 1.55;
  background:
    radial-gradient(1100px 560px at 88% -12%, #F4E5C2 0, rgba(244, 229, 194, 0) 62%),
    radial-gradient(900px 520px at -12% 108%, #F2E6CC 0, rgba(242, 230, 204, 0) 60%),
    var(--bg);
  background-attachment: fixed;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 40px;
  min-height: 100vh;
}
[hidden] { display: none !important; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold-2); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; text-wrap: balance; margin: 0; line-height: 1.12; }

.wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 22px; }

/* Шапка */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; padding-bottom: 18px; border-bottom: 1px solid var(--gold-line); position: relative; }
.top::after { content: ""; position: absolute; left: 0; bottom: -4px; width: 7px; height: 7px; background: var(--gold-2); transform: rotate(45deg); }
.eyebrow { font-size: .72rem; letter-spacing: .28em; text-transform: uppercase; color: var(--accent); font-weight: 600; display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.eyebrow::before { content: ""; width: 28px; height: 1px; background: linear-gradient(90deg, var(--gold-1), var(--gold-3)); }
.brand { font-size: clamp(2rem, 5.5vw, 3rem); line-height: 1.02; }
.brand em, .gold-text { font-style: italic; background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent; padding-right: .05em; }

/* Прогресс */
.progress { display: grid; gap: 8px; }
.progress-row { display: flex; justify-content: space-between; gap: 12px; font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.progress-row b { color: var(--accent); font-weight: 600; letter-spacing: .04em; }
.track { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.track span { display: block; height: 100%; background: var(--gold-grad); border-radius: 2px; transition: width .35s ease; }

/* Карточка экрана */
.card { background: var(--surface); border: 1px solid var(--gold-line); border-radius: var(--r); box-shadow: var(--shadow); padding: 28px 26px; display: grid; gap: 20px; min-width: 0; }
.card.soft { background: linear-gradient(180deg, #FFFCF5 0%, var(--surface) 40%); }
.q-label { font-size: .7rem; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.q-title { font-size: clamp(1.7rem, 4.6vw, 2.4rem); }
.lead { margin: 0; color: var(--muted); max-width: 62ch; }
.lead strong { color: var(--ink); font-weight: 600; }

.ghost { background: transparent; border: 1px solid var(--gold-line); color: var(--accent); border-radius: 999px; padding: 7px 16px; font-size: .9rem; letter-spacing: .03em; }
.ghost:hover { background: var(--accent-soft); border-color: var(--gold-2); }
.ghost.small { padding: 5px 12px; font-size: .84rem; }
.primary { background: var(--gold-grad); color: #FFFFFF; border: 0; border-radius: 999px; padding: 12px 26px; font-weight: 600; letter-spacing: .06em; text-shadow: 0 1px 1px rgba(90, 60, 10, .35); box-shadow: 0 10px 22px -12px rgba(143, 109, 44, .8), inset 0 1px 0 rgba(255, 255, 255, .45); transition: transform .15s ease, box-shadow .15s ease, opacity .15s; }
.primary:hover:not(:disabled) { transform: translateY(-1px); }
.primary:disabled { opacity: .45; cursor: default; box-shadow: none; }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; font-size: .92rem; }

/* Подсказка-эпизод */
.hint { border-left: 2px solid var(--gold-2); background: var(--accent-soft); padding: 12px 16px; border-radius: 0 12px 12px 0; font-family: var(--f-display); font-style: italic; font-size: 1.15rem; line-height: 1.45; color: var(--ink); max-width: 66ch; }

/* Варианты ответа */
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.group-title { grid-column: 1 / -1; font-family: var(--f-display); font-style: italic; font-size: 1.25rem; color: var(--accent); margin-top: 8px; }
.opt { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 12px; align-items: start; text-align: left; background: #FFFDF9; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; line-height: 1.4; transition: border-color .15s, background .15s; }
.opt:hover { border-color: var(--gold-line); }
.opt .box { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--gold-line); display: grid; place-items: center; margin-top: 1px; }
.opt[aria-pressed="true"] { border-color: var(--gold-2); background: var(--accent-soft); }
.opt[aria-pressed="true"] .box { background: var(--gold-grad); border-color: transparent; }
.opt[aria-pressed="true"] .box::after { content: ""; width: 8px; height: 4px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg) translate(1px, -1px); }

.field { display: grid; gap: 6px; }
.field label, .field .lbl { font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
textarea, input[type="text"] { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: #FFFDF9; }
textarea { min-height: 72px; resize: vertical; }
textarea:focus, input[type="text"]:focus { outline: none; border-color: var(--gold-2); box-shadow: 0 0 0 3px rgba(191, 154, 78, .18); }

/* Навигация внизу экрана */
.nav { position: sticky; bottom: 0; z-index: 5; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 0 calc(14px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(180deg, rgba(251, 248, 241, 0) 0%, var(--bg) 35%); }
.nav .note { font-size: .86rem; color: var(--muted); text-align: center; flex: 1; font-variant-numeric: tabular-nums; }

/* Карточки ценностей */
.vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.vcard { border: 1px solid var(--line); border-radius: 16px; padding: 16px; background: #FFFDF9; display: grid; gap: 8px; align-content: start; min-width: 0; }
.vcard.on { border-color: var(--gold-2); background: var(--accent-soft); }
.vcard.off { opacity: .55; }
.vname { font-family: var(--f-display); font-size: 1.4rem; font-weight: 600; line-height: 1.15; display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.vname .score { font-family: var(--f-body); font-size: .76rem; color: var(--accent); font-weight: 600; letter-spacing: .04em; white-space: nowrap; }
.vmean { margin: 0; color: var(--muted); font-size: .93rem; }
.vev { margin: 0; font-size: .86rem; color: var(--bronze); font-style: italic; overflow-wrap: anywhere; }
.vact { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.pick { border: 1px solid var(--gold-2); color: var(--gold-3); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: .88rem; font-weight: 600; }
.vcard.on .pick { background: var(--gold-grad); color: #fff; border-color: transparent; }
.section-title { font-family: var(--f-display); font-size: 1.5rem; margin-top: 6px; }
.counter { display: inline-flex; align-items: baseline; gap: 6px; font-variant-numeric: tabular-nums; }
.counter b { font-family: var(--f-display); font-size: 2.2rem; line-height: 1; color: var(--gold-3); }
.dots { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; max-width: 360px; }
.dots span { height: 5px; border-radius: 3px; background: var(--line); }
.dots span.on { background: var(--gold-grad); }
.warn { margin: 0; color: var(--danger); font-size: .88rem; }

/* Детали ценности */
.dcard { border: 1px solid var(--gold-line); border-radius: 18px; padding: 18px; background: #FFFDF9; display: grid; gap: 12px; }
.dhead { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 10px; align-items: center; }
.dnum { font-family: var(--f-display); font-style: italic; font-size: 1.6rem; color: var(--gold-3); text-align: center; }
.dhead input { font-family: var(--f-display); font-size: 1.35rem; font-weight: 600; }
.imp { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.imp button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--gold-line); background: var(--surface); color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
.imp button[aria-pressed="true"] { background: var(--gold-grad); color: #fff; border-color: transparent; }
.imp small { color: var(--muted); font-size: .8rem; margin-left: 4px; }
.own { margin: 0; padding-left: 18px; color: var(--muted); font-size: .93rem; }
.own li { margin-bottom: 4px; }

/* Итог */
.tablebox { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 620px; font-size: .95rem; }
th, td { text-align: left; vertical-align: top; padding: 12px; border-bottom: 1px solid var(--line); }
th { font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); font-weight: 600; border-bottom: 1px solid var(--gold-line); }
td.n { font-family: var(--f-display); font-style: italic; font-size: 1.35rem; color: var(--gold-3); width: 40px; font-variant-numeric: tabular-nums; }
td.v { font-family: var(--f-display); font-size: 1.22rem; font-weight: 600; width: 22%; }
td.v small { display: block; font-family: var(--f-body); font-weight: 400; color: var(--muted); font-size: .8rem; }
td.ex { color: var(--muted); font-style: italic; }
.prio { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.prio div { border: 1px solid var(--gold-2); background: linear-gradient(135deg, #FFFBF1, var(--accent-soft)); border-radius: 14px; padding: 16px 18px; font-family: var(--f-display); font-size: 1.4rem; font-weight: 600; color: var(--gold-3); }
.statement { font-family: var(--f-display); font-size: 1.45rem; font-style: italic; line-height: 1.45; margin: 0; max-width: 62ch; border-left: 2px solid var(--gold-2); padding-left: 18px; white-space: pre-wrap; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.hint-text { color: var(--muted); font-size: .88rem; margin: 0; }

/* Вступление */
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.steps li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: baseline; }
.steps li span { font-family: var(--f-display); font-style: italic; font-size: 1.3rem; color: var(--gold-3); text-align: right; }

.install { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; background: var(--surface); border: 1px solid var(--gold-line); border-radius: 16px; padding: 12px 16px; box-shadow: var(--shadow); }
.install p { margin: 0; font-size: .92rem; color: var(--muted); max-width: 60ch; }
.install strong { color: var(--ink); font-weight: 600; }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: .9rem; color: var(--muted); }
.danger-btn { background: var(--danger); color: #fff; border: 0; border-radius: 999px; padding: 7px 14px; font-size: .9rem; }
.foot { text-align: center; color: var(--muted); font-size: .8rem; margin: 0; }

/* Макет PDF (лист A4, рисуется вне экрана) */
.sheet-holder { position: fixed; left: -10000px; top: 0; }
/* Лист = область A4 внутри полей 12 мм: 186 × 272 мм (на 1 мм ниже, чтобы не появилась пустая страница) */
.pdf-page { width: 186mm; height: 272mm; position: relative; overflow: hidden; background: #FFFFFF; color: #2B2418; font-family: var(--f-body); font-size: 12.5px; line-height: 1.5; box-sizing: border-box; padding: 4mm 2mm 0; }
.pdf-body { display: block; }
.s-header { padding-bottom: 4px; }
.pdf-foot { position: absolute; left: 2mm; right: 2mm; bottom: 2mm; display: flex; justify-content: space-between; border-top: 1px solid #EADFC8; padding-top: 6px; font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: #BF9A4E; }
.s-eyebrow { font-size: 10px; letter-spacing: .26em; text-transform: uppercase; color: #8F6D2C; font-weight: 600; }
.s-title { font-family: var(--f-display); font-size: 36px; font-weight: 600; color: #2B2418; margin-top: 6px; line-height: 1.1; }
.s-rule { height: 2px; margin: 14px 0 6px; background: linear-gradient(90deg, #E2C47F, #8F6D2C 60%, rgba(143, 109, 44, 0)); }
.s-row { display: grid; grid-template-columns: 24px 132px minmax(0, 1fr) minmax(0, 1fr); gap: 12px; overflow-wrap: anywhere; padding: 7px 0; border-bottom: 1px solid #EADFC8; break-inside: avoid; page-break-inside: avoid; }
.s-head { font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: #8F6D2C; font-weight: 600; border-bottom: 1px solid #DCC594; }
.s-n { font-family: var(--f-display); font-style: italic; font-size: 20px; color: #8F6D2C; line-height: 1.1; }
.s-v { font-family: var(--f-display); font-size: 18px; font-weight: 600; line-height: 1.15; }
.s-v small { display: block; font-family: var(--f-body); font-size: 10.5px; font-weight: 400; color: #7B6F5B; margin-top: 3px; }
.s-ex { color: #7B6F5B; font-style: italic; }
.s-block { margin-top: 16px; break-inside: avoid; page-break-inside: avoid; }
.s-label { font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase; color: #8F6D2C; font-weight: 600; margin-bottom: 8px; }
.s-prio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.s-prio div { border: 1px solid #BF9A4E; background: #FBF5E7; border-radius: 10px; padding: 9px 12px; font-family: var(--f-display); font-size: 18px; font-weight: 600; color: #8F6D2C; }
.s-statement { margin: 0; font-family: var(--f-display); font-style: italic; font-size: 17px; line-height: 1.5; border-left: 2px solid #BF9A4E; padding-left: 14px; white-space: pre-wrap; }


/* Запасной путь: печать → «Сохранить как PDF» */
@media print {
  body { background: #FFFFFF; padding: 0; }
  .top, .progress, .nav, .install, .foot, .row, #resetZone { display: none !important; }
  .card { box-shadow: none; border: 0; padding: 0; }
  .sheet-holder { display: none; }
}

@media (max-width: 560px) {
  body { font-size: 15px; padding-block: 20px 28px; }
  .card { padding: 22px 18px; }
  .opts, .vgrid { grid-template-columns: minmax(0, 1fr); }
  .nav .note { display: none; }
  /* на телефоне таблица превращается в карточки */
  table { min-width: 0; }
  thead { display: none; }
  table, tbody, td { display: block; width: auto; }
  tr { display: grid; grid-template-columns: 36px minmax(0, 1fr); column-gap: 8px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  td { border: 0; padding: 3px 0; }
  td.n { grid-row: span 3; width: auto; }
  td.v { width: auto; }
  td[data-label]::before { content: attr(data-label); display: block; font-family: var(--f-body); font-style: normal; font-size: .66rem; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin-top: 6px; }
}
@media (prefers-reduced-motion: reduce) { .primary, .track span { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Личная сессия</div>
      <div class="brand">Мои <em>10</em> ценностей</div>
    </div>
    <div id="resetZone"></div>
  </header>

  <div class="install" id="install" hidden>
    <p id="installText"><strong>Поставь приложение на телефон.</strong> Оно будет открываться с экрана, как обычное приложение, и работать без интернета.</p>
    <div class="row">
      <button class="primary" id="installBtn" type="button" hidden>Установить</button>
      <button class="ghost" id="installClose" type="button">Не сейчас</button>
    </div>
  </div>

  <div class="progress" id="progress"></div>
  <main id="app"></main>

  <p class="foot">Все ответы хранятся только на этом устройстве и никуда не отправляются.</p>
</div>
<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
